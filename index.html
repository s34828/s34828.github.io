<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เตชินท์ — หน้าแนะนำตัว</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg: #F7F6F2;
            --ink: #14201E;
            --ink-soft: #4A5754;
            --teal: #1F5C57;
            --teal-soft: #E8EFEE;
            --line: #DCDCD2;
            --paper: #FFFFFF;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Prompt', sans-serif;
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 48px 20px;
        }

        .card {
            max-width: 880px;
            width: 100%;
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 4px;
            display: grid;
            grid-template-columns: 1fr 300px;
            overflow: hidden;
        }

        /* ---- content ---- */
        .content {
            padding: 64px 56px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .eyebrow {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--teal);
            margin-bottom: 18px;
        }

        h1 {
            font-size: 40px;
            font-weight: 600;
            line-height: 1.15;
            letter-spacing: -0.01em;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 15px;
            font-weight: 400;
            color: var(--ink-soft);
            margin-bottom: 36px;
        }

        /* signature element: pulse line */
        .pulse {
            width: 100%;
            max-width: 260px;
            height: 32px;
            margin-bottom: 36px;
        }
        .pulse path {
            fill: none;
            stroke: var(--teal);
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 300;
            stroke-dashoffset: 300;
            animation: draw 2.2s ease-out forwards;
        }
        @keyframes draw {
            to { stroke-dashoffset: 0; }
        }
        @media (prefers-reduced-motion: reduce) {
            .pulse path { animation: none; stroke-dashoffset: 0; }
        }

        .info-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
            margin-bottom: 8px;
        }

        .info-item {
            display: grid;
            grid-template-columns: 84px 1fr;
            align-items: baseline;
            padding: 14px 0;
            border-top: 1px solid var(--line);
        }
        .info-item:last-child { border-bottom: 1px solid var(--line); }

        .info-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--ink-soft);
        }

        .info-value {
            font-size: 15px;
            font-weight: 500;
            color: var(--ink);
        }

        .github-note {
            margin-top: 24px;
            padding: 14px 0 0;
            font-size: 13px;
            color: var(--ink-soft);
            display: flex;
            gap: 8px;
            align-items: baseline;
        }
        .github-note strong { color: var(--teal); font-weight: 600; }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 36px;
            padding: 14px 0;
            background: none;
            color: var(--teal);
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            width: fit-content;
            border-bottom: 1.5px solid var(--teal);
            transition: gap 0.25s ease, opacity 0.25s ease;
        }
        .btn:hover { gap: 16px; opacity: 0.75; }
        .btn svg { width: 16px; height: 16px; }

        /* ---- image ---- */
        .image-section {
            position: relative;
            background: var(--teal-soft);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .profile-img-wrapper {
            position: relative;
            width: 220px;
            height: 220px;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--line);
        }

        .ring {
            position: absolute;
            inset: -10px;
            border: 1px solid var(--teal);
            border-radius: 50%;
            opacity: 0.35;
        }

        .badge {
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--paper);
            border: 1px solid var(--line);
            padding: 8px 16px;
            border-radius: 30px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.04em;
            color: var(--teal);
            white-space: nowrap;
        }

        @media (max-width: 720px) {
            .card {
                grid-template-columns: 1fr;
            }
            .image-section {
                padding: 48px 20px 60px;
            }
            .content {
                padding: 48px 32px;
                order: 2;
            }
            h1 { font-size: 32px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="content">
            <span class="eyebrow">สวัสดีครับ / Hello</span>
            <h1>เตชินท์<br>Techin</h1>
            <p class="subtitle">สนใจคณะแพทย์ · Interested in Medicine</p>

            <svg class="pulse" viewBox="0 0 260 32" xmlns="http://www.w3.org/2000/svg">
                <path d="M0 16 H90 L100 4 L112 28 L124 16 H260" />
            </svg>

            <div class="info-list">
                <div class="info-item">
                    <span class="info-label">Field</span>
                    <span class="info-value">Medical</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Target</span>
                    <span class="info-value">The Faculty of Medicine, Ramathibodi</span>
                </div>
            </div>

            <p class="github-note">🌐 นี่คือเว็บไซต์แรกของผมที่โฮสต์บน <strong>GitHub Pages</strong></p>

            <a href="portfolio.html" class="btn">
                เปิดหน้าถัดไป
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3" />
                </svg>
            </a>
        </div>

        <div class="image-section">
            <div class="profile-img-wrapper">
                <div class="ring"></div>
                <!-- ใส่ path รูปภาพของคุณที่นี่ -->
                <img src="IMG_7964.jpeg" alt="Techin" class="profile-img">
                <span class="badge">🩺 Med Student</span>
            </div>
        </div>
    </div>
</body>
</html>
